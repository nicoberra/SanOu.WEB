<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 138" role="img" aria-label="San Ou">
  <defs>

    <!-- ── GRADIENTE CROMO LETRAS ── -->
    <linearGradient id="g-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c1c1c"/>
      <stop offset="7%"   stop-color="#808080"/>
      <stop offset="20%"  stop-color="#ffffff"/>
      <stop offset="32%"  stop-color="#c4c4c4"/>
      <stop offset="46%"  stop-color="#eeeeee"/>
      <stop offset="61%"  stop-color="#aaaaaa"/>
      <stop offset="77%"  stop-color="#606060"/>
      <stop offset="90%"  stop-color="#363636"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <!-- ── GRADIENTES TUERCA — alto contraste, como la referencia ── -->

    <!-- Cara SUPERIOR: blanco casi puro -->
    <linearGradient id="g-nt" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%"   stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Cara SUPERIOR-DERECHA: máximo brillo (fuente de luz) -->
    <linearGradient id="g-ntr" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Cara DERECHA: media-brillante -->
    <linearGradient id="g-nr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#686868"/>
    </linearGradient>

    <!-- Cara INFERIOR-DERECHA: transición fuerte a sombra -->
    <linearGradient id="g-nbr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#606060"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>

    <!-- Cara INFERIOR: casi negro, sombra fuerte -->
    <linearGradient id="g-nb" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#383838"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>

    <!-- Cara INFERIOR-IZQUIERDA: muy oscura -->
    <linearGradient id="g-nbl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#404040"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Cara IZQUIERDA: semisombra-media -->
    <linearGradient id="g-nl" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#484848"/>
    </linearGradient>

    <!-- Cara SUPERIOR-IZQUIERDA: semiluminada -->
    <linearGradient id="g-ntl" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#989898"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>

    <!-- Agujero negro profundo -->
    <radialGradient id="g-hole" cx="35%" cy="30%" r="68%">
      <stop offset="0%"   stop-color="#242424"/>
      <stop offset="55%"  stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#010101"/>
    </radialGradient>

    <!-- Aro cromo (borde del agujero) -->
    <linearGradient id="g-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cccccc"/>
      <stop offset="40%"  stop-color="#585858"/>
      <stop offset="100%" stop-color="#aaaaaa"/>
    </linearGradient>

    <!-- Reflejo especular en cara superior (brillo puntual) -->
    <radialGradient id="g-spec" cx="55%" cy="35%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- ── SOMBRA GLOBAL ── -->
    <filter id="f-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4"
                    flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- ── CLIP TUERCA ──
         Octágono 60×88px, centrado en (180, 84)
         Cara plana arriba y abajo, vértices a los lados
    -->
    <!-- Octágono (flat-top/bottom): 163,40→197,40→210,60→210,108→197,128→163,128→150,108→150,60 -->
    <clipPath id="nut-clip2">
      <polygon points="163,40 197,40 210,60 210,108 197,128 163,128 150,108 150,60"/>
    </clipPath>

  </defs>

  <g filter="url(#f-shadow)">

    <!-- ── LETRAS "SAN" ──
         Bebas Neue 124px, SAN = 148px → termina en x=4+148=152
    -->
    <text
      x="4" y="128"
      font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif"
      font-size="124"
      font-weight="400"
      letter-spacing="0"
      fill="url(#g-chrome)">SAN</text>

    <!-- ══════════════════════════════════
         TUERCA — octágono 60×88, centro (180,84)
         Vértices:
           (163,40)  top-L
           (197,40)  top-R
           (210,60)  right-top
           (210,108) right-bottom
           (197,128) bot-R
           (163,128) bot-L
           (150,108) left-bottom
           (150,60)  left-top
         ══════════════════════════════════ -->

    <!-- Cara superior (tope, blanco brillante) -->
    <polygon points="180,84 163,40 197,40"    fill="url(#g-nt)"  clip-path="url(#nut-clip2)"/>
    <!-- Cara superior-derecha (brillo máximo) -->
    <polygon points="180,84 197,40 210,60"    fill="url(#g-ntr)" clip-path="url(#nut-clip2)"/>
    <!-- Cara derecha (media) -->
    <polygon points="180,84 210,60 210,108"   fill="url(#g-nr)"  clip-path="url(#nut-clip2)"/>
    <!-- Cara inferior-derecha (sombra suave) -->
    <polygon points="180,84 210,108 197,128"  fill="url(#g-nbr)" clip-path="url(#nut-clip2)"/>
    <!-- Cara inferior (muy oscura) -->
    <polygon points="180,84 197,128 163,128"  fill="url(#g-nb)"  clip-path="url(#nut-clip2)"/>
    <!-- Cara inferior-izquierda (sombra) -->
    <polygon points="180,84 163,128 150,108"  fill="url(#g-nbl)" clip-path="url(#nut-clip2)"/>
    <!-- Cara izquierda (semisombra) -->
    <polygon points="180,84 150,108 150,60"   fill="url(#g-nl)"  clip-path="url(#nut-clip2)"/>
    <!-- Cara superior-izquierda (semiluminada) -->
    <polygon points="180,84 150,60 163,40"    fill="url(#g-ntl)" clip-path="url(#nut-clip2)"/>

    <!-- Contorno exterior del octágono -->
    <polygon
      points="163,40 197,40 210,60 210,108 197,128 163,128 150,108 150,60"
      fill="none"
      stroke="url(#g-rim)"
      stroke-width="2"
      stroke-linejoin="miter"/>

    <!-- Líneas de separación entre facetas (efecto 3D) -->
    <g stroke-width="0.7" fill="none">
      <line x1="180" y1="84" x2="163" y2="40"  stroke="#e0e0e0" opacity="0.55"/>
      <line x1="180" y1="84" x2="197" y2="40"  stroke="#f0f0f0" opacity="0.65"/>
      <line x1="180" y1="84" x2="210" y2="60"  stroke="#c0c0c0" opacity="0.50"/>
      <line x1="180" y1="84" x2="210" y2="108" stroke="#707070" opacity="0.40"/>
      <line x1="180" y1="84" x2="197" y2="128" stroke="#505050" opacity="0.40"/>
      <line x1="180" y1="84" x2="163" y2="128" stroke="#444444" opacity="0.40"/>
      <line x1="180" y1="84" x2="150" y2="108" stroke="#585858" opacity="0.40"/>
      <line x1="180" y1="84" x2="150" y2="60"  stroke="#a0a0a0" opacity="0.50"/>
    </g>

    <!-- Reflejo especular en zona superior-derecha de la tuerca -->
    <polygon
      points="163,40 197,40 210,60 210,108 197,128 163,128 150,108 150,60"
      fill="url(#g-spec)"
      clip-path="url(#nut-clip2)"/>

    <!-- Aro cromo alrededor del agujero (collar interior) -->
    <circle cx="180" cy="84" r="22" fill="url(#g-rim)"/>

    <!-- Agujero negro profundo -->
    <circle cx="180" cy="84" r="17" fill="url(#g-hole)"/>

    <!-- Micro-reflejo blanco en el agujero (esquina sup-izq) -->
    <ellipse cx="173" cy="77" rx="5.5" ry="4"
             fill="white" opacity="0.22" transform="rotate(-35,173,77)"/>

    <!-- ── LETRA "U" ──
         Empieza en x=210 (borde derecho de la tuerca)
    -->
    <text
      x="210" y="128"
      font-family="'Bebas Neue', Impact, 'Arial Black', sans-serif"
      font-size="124"
      font-weight="400"
      letter-spacing="0"
      fill="url(#g-chrome)">U</text>

  </g>

</svg>
